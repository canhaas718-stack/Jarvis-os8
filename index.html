<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OS - Ultimate Sun HUD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #010409;
            color: #00f0ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Deep Space HUD Hintergrund */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at center, rgba(0, 240, 255, 0.15) 0%, rgba(1, 4, 9, 0.95) 80%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            pointer-events: none;
            z-index: 1;
        }

        /* Sauberer Header ohne Befehlsanzeigen */
        header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            background: rgba(1, 4, 9, 0.85);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .system-status {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-tag {
            color: #00ff88;
            font-weight: bold;
            text-shadow: 0 0 8px #00ff88;
        }

        /* ZENTRALES SONNEN-HUD */
        .hud-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            z-index: 10;
        }

        /* Sonnenstrahlen (Audio-Visualizer) */
        .sun-rays-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .ray {
            position: absolute;
            width: 3px;
            height: 20px;
            background: #00f0ff;
            border-radius: 2px;
            box-shadow: 0 0 10px #00f0ff;
            transform-origin: center 180px; /* Strahlen-Abstand vom Zentrum */
            transition: height 0.05
